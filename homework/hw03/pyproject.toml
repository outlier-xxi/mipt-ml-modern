[project]
name = "hw03"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "torch>=2.9.0",
    "transformers>=4.30.0,<4.40.0",
    "detectron2",
    "pytesseract>=0.3.13",
    "ipywidgets>=8.1.8",
    "ipykernel>=7.1.0",
    "torchvision>=0.24.0",
    "accelerate>=0.20.0,<0.29.0",
    "sentencepiece>=0.2.1",
    "sacremoses>=0.1.1",
    "wandb>=0.23.0",
    "dotenv>=0.9.9",
